spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/policy_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.show-sql=true

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://localhost:8081/realms/policy-realm}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:http://localhost:8081/realms/policy-realm/protocol/openid-connect/certs}

app.openapi.server-url=${APP_OPENAPI_SERVER_URL:http://localhost:8080}
app.openapi.server-description=Ambiente local
app.openapi.oauth-issuer-uri=${APP_OPENAPI_OAUTH_ISSUER_URI:http://localhost:8081/realms/policy-realm}

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

management.endpoint.health.show-details=always
