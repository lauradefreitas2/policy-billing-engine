spring.application.name=policy-billing-engine

spring.datasource.url=jdbc:postgresql://localhost:5432/policy_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/policy-realm

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.doc-expansion=list
springdoc.swagger-ui.default-models-expand-depth=1
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.oauth.client-id=policy-engine-swagger
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
management.metrics.tags.application=${spring.application.name}

info.app.name=Policy Billing Engine
info.app.version=1.3.0-SNAPSHOT
info.app.description=Recurring mobile insurance policy billing engine
info.app.architecture=Hexagonal Architecture
